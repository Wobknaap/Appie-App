import requests
import pandas as pd
import time
import random
import uuid
import os
from datetime import datetime

# --- CONFIGURATIE ---
STORE_ID = "1558"
CSV_FILE = "koopjes_historie.csv"

# Voeg een willekeurige vertraging toe tussen de 0 en 5 minuten
# Zo voorkom je dat je exact elke 20ste minuut aan de deur klopt
delay = random.randint(0, 300) 
print(f"Wachten voor {delay} seconden om menselijk gedrag na te bootsen...")
time.sleep(delay)

def get_data():
    # Headers overgenomen uit de technische documentatie
    headers = {
        "User-Agent": "Appie/9.28 (iPhone17,3; iPhone; CPU OS 26_1 like Mac OS X)",
        "x-application": "AHWEBSHOP",
        "x-fraud-detection-installation-id": str(uuid.uuid4())
    }
    
    # Haal anoniem token op
    auth_res = requests.post("https://api.ah.nl/mobile-auth/v1/auth/token/anonymous", 
                             json={"clientId": "appie-ios"}, headers=headers)
    token = auth_res.json()['access_token']
    headers["Authorization"] = f"Bearer {token}"

    # De GraphQL query voor de koopjes
    query = """
    query GetBargains($storeId: String!) {
      bargainItems(storeId: $storeId) {
        product { title brand }
        bargainPrice { priceNow priceWas }
        markdown { markdownPercentage }
        stock
      }
    }
    """
    
    res = requests.post("https://api.ah.nl/graphql", 
                         json={'query': query, 'variables': {'storeId': STORE_ID}}, 
                         headers=headers)
    return res.json().get('data', {}).get('bargainItems', [])

# Data ophalen en opslaan
items = get_data()
if items:
    new_df = pd.json_normalize(items)
    new_df['timestamp'] = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
    
    # Als het bestand al bestaat, plakken we het eronder (append)
    if os.path.exists(CSV_FILE):
        df = pd.read_csv(CSV_FILE)
        df = pd.concat([df, new_df], ignore_index=True)
    else:
        df = new_df
        
    df.to_csv(CSV_FILE, index=False)
    print(f" {len(items)} items toegevoegd aan de historie.")
